
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20

      - name: Check root lockfile
        run: |
          test -f package-lock.json
          node -e "const p=require('./package-lock.json'); if (!p.lockfileVersion || !p.packages) process.exit(1)"

      - run: npm ci
      - run: npm run lint --workspace @hackhub/web
      - run: npm test --workspace @hackhub/web
      - run: npm run build --workspace @hackhub/web

  backend:
    name: backend (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20

      - name: Check root lockfile
        run: |
          test -f package-lock.json
          node -e "const p=require('./package-lock.json'); if (!p.lockfileVersion || !p.packages) process.exit(1)"

      - run: npm ci
      - run: npm run lint --workspace @hackhub/api
      - run: npm test --workspace @hackhub/api

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          version=8.28.0
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo /tmp >> "$GITHUB_PATH"

      - name: Scan for leaked secrets
        run: gitleaks detect --source . --redact --verbose
