name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks:
    name: production checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Check API
        run: |
          npm run lint --workspace @hackhub/api --if-present
          npm test --workspace @hackhub/api
      - name: Check web app
        run: |
          npm run lint --workspace @hackhub/web
          npm run build --workspace @hackhub/web

  deploy:
    name: deploy live services
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy API to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY_PRODUCTION }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID_PRODUCTION }}
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY_PRODUCTION"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing RENDER_SERVICE_ID_PRODUCTION"; exit 1; }
          test -n "$API_URL" || { echo "Missing PRODUCTION_API_URL"; exit 1; }
          deploy=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"commitId\":\"$GITHUB_SHA\"}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          deploy_id=$(jq -er '.id' <<< "$deploy")
          for attempt in $(seq 1 30); do
            status=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" | jq -er '.status')
            case "$status" in
              live) echo "Render deploy $deploy_id is live."; break ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "Render deploy $deploy_id failed with status $status."; exit 1 ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                echo "Attempt $attempt/30: Render deploy status is $status." ;;
              *) echo "Unexpected Render deploy status: $status"; exit 1 ;;
            esac
            if [[ "$status" == live ]]; then break; fi
            if [[ "$attempt" == 30 ]]; then echo "Render deploy timed out."; exit 1; fi
            sleep 20
          done
          for attempt in $(seq 1 15); do
            if curl --fail --silent "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "Production API is healthy."
              exit 0
            fi
            echo "Attempt $attempt/15: API not healthy; waiting 10 seconds."
            sleep 10
          done
          echo "Production API did not become healthy in time."
          exit 1
      - name: Build and deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}/api
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID"; exit 1; }
          npm ci
          npm install --global vercel@latest
          vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Run production smoke checks
        working-directory: apps/api
        env:
          STAGING_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: node scripts/smoke-staging.js