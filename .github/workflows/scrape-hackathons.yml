name: Scrape hackathons

# Daily catalogue refresh. Runs the same CLI as a manual scrape, so this works
# on hosts that sleep between requests (Render free tier) — the job does not
# depend on the API process being awake.
#
# Required repository secret: MONGODB_URI
# Optional: MONGODB_DATABASE (when the URI has no default db)
# Optional: SERPAPI_KEY (enables the Google/web-search discovery source)

on:
  schedule:
    # 03:10 IST daily (21:40 UTC the previous day).
    - cron: '40 21 * * *'
  # Intentionally no workflow_dispatch inputs: the scrape parameters come from
  # repository/environment variables so event input cannot influence the build
  # or the command that runs (CI-01 / CKV_GHA_7).
  workflow_dispatch:

concurrency:
  group: scrape-hackathons
  cancel-in-progress: false

# Least privilege: the scraper only reads the repository and uses the
# configured database secret.
permissions:
  contents: read

jobs:
  scrape:
    name: Refresh catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20

      - run: npm ci

      - name: Run scrapers
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: ${{ secrets.MONGODB_DATABASE }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCRAPER_USER_AGENT: 'HackHubBot/1.0 (+https://github.com/run-time-code/HackHub)'
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-placeholder' }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET || 'ci-placeholder' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'ci-placeholder' }}
          # Set these as repository/environment variables, not dispatch inputs.
          # SOURCES format: comma-separated keys from the scraper registry.
          SOURCES: ${{ vars.SCRAPE_SOURCES }}
          DRY_RUN: ${{ vars.SCRAPE_DRY_RUN }}
          # Config module requires production secrets; the scraper does not
          # use them, these placeholders keep config validation quiet.
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "::error::MONGODB_URI secret is not configured"
            exit 1
          fi
          # Validate operator-controlled configuration before using it as an
          # argument. This keeps the command surface to known characters.
          if [ -n "$SOURCES" ] && ! printf '%s' "$SOURCES" | grep -Eq '^[A-Za-z0-9_,-]+$'; then
            echo "::error::SCRAPE_SOURCES contains invalid characters"
            exit 1
          fi
          if [ -n "$SOURCES" ] && [ "${#SOURCES}" -gt 500 ]; then
            echo "::error::SCRAPE_SOURCES is too long"
            exit 1
          fi
          args=""
          if [ -n "$SOURCES" ]; then
            for source in $(echo "$SOURCES" | tr ',' ' '); do
              args="$args --source=$source"
            done
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args="$args --dry-run"
          fi
          npm run scrape --workspace @hackhub/api -- $args
