name: Deploy to staging

# develop -> staging auto-deploy (owner: Senthil Raja).
# API -> Render (via deploy hook), frontend -> Vercel, DB -> Atlas staging.
# Setup runbook: docs/staging.md

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  backend-checks:
    name: backend checks (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test

  deploy-api:
    name: deploy API to Render (staging)
    runs-on: ubuntu-latest
    needs: backend-checks
    environment: staging
    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}" ]; then
            echo "::error::Missing secret RENDER_DEPLOY_HOOK_STAGING."
            echo "See docs/staging.md section 3 (Render service + deploy hook)."
            exit 1
          fi
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
          echo "Render staging deploy triggered."
      - name: Wait for API health
        run: |
          if [ -z "${{ secrets.STAGING_API_URL }}" ]; then
            echo "::error::Missing secret STAGING_API_URL (e.g. https://hackhub-api-staging.onrender.com)."
            echo "See docs/staging.md section 5."
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -sSf "${{ secrets.STAGING_API_URL }}/health" | grep -q '"status":"ok"'; then
              echo "Staging API is healthy."
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet, waiting 20s..."
            sleep 20
          done
          echo "::error::Staging API did not become healthy in time."
          exit 1

  deploy-frontend:
    name: deploy frontend to Vercel (staging)
    runs-on: ubuntu-latest
    needs: backend-checks
    environment: staging
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Skip if frontend app not created yet
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No frontend/package.json yet (frontend Week 1 tasks land it). Skipping Vercel deploy."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 20
      - run: npm ci
        if: steps.check.outputs.exists == 'true'
      - run: npm run build
        if: steps.check.outputs.exists == 'true'
        env:
          VITE_API_URL: ${{ secrets.STAGING_API_URL }}
      - name: Deploy to Vercel
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Missing Vercel secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)."
            echo "See docs/staging.md section 4."
            exit 1
          fi
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" > vercel-url.txt
          cat vercel-url.txt

  smoke:
    name: staging smoke checks
    runs-on: ubuntu-latest
    needs: deploy-api
    environment: staging
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke checks against staging API
        run: node scripts/smoke-staging.js
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
