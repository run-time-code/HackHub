openapi: 3.0.3

info:
  title: HackHub API
  description: >-
    OpenAPI coverage for authentication, team collaboration, hackathon
    discovery, calendar/reminders, and saved hackathon tracking. The full
    endpoint reference is also available in docs/API_SPEC.md.
  version: 1.0.0

servers:
  - url: http://localhost:5000/api

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Teams
    description: Team collaboration for hackathons
  - name: Hackathons
    description: Public hackathon catalogue
  - name: Calendar
    description: User calendar events
  - name: Reminders
    description: Reminder preferences and delivery jobs
  - name: Saved hackathons
    description: User saved-hackathon tracking
  - name: Operations
    description: Health and metrics

paths:

  /health:
    get:
      tags: [Operations]
      summary: Check API and MongoDB readiness.
      responses:
        "200": { description: API and database are ready. }
        "503": { description: Database is unavailable. }

  /metrics:
    get:
      tags: [Operations]
      summary: Get Prometheus process, HTTP, and reminder scheduler metrics.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "404": { description: Metrics are unavailable or the token is invalid. }

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account and sends an email verification link. Registration is completed only after the email is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Verification email sent. Please verify your email to complete registration.
        "400":
          description: Invalid input
        "409":
          description: User already exists
        "500":
          description: Server error

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful. Access and refresh tokens are sent as HTTP-only cookies.
        "400":
          description: Invalid input
        "401":
          description: Invalid email or password
        "403":
          description: Please verify your email before logging in
        "500":
          description: Server error

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication tokens
      responses:
        "200":
          description: Tokens refreshed successfully. New access and refresh tokens are sent as HTTP-only cookies.
        "401":
          description: Refresh token missing or invalid
        "500":
          description: Server error

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      responses:
        "200":
          description: Logout successful
        "500":
          description: Server error

  /auth/protected:
    get:
      tags:
        - Authentication
      summary: Access a protected route
      description: Requires a valid access token.
      responses:
        "200":
          description: Protected route accessed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: You accessed a protected route
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 68c123456789abcdef123456
                      email:
                        type: string
                        example: berwincr4028@gmail.com
                      role:
                        type: string
                        example: student
        "401":
          description: Authentication required or access token is invalid/expired

  /auth/admin-test:
    get:
      tags:
        - Authentication
      summary: Test admin role access
      description: Requires a valid access token and admin role.
      responses:
        "200":
          description: Admin access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Admin access granted
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 68c123456789abcdef123456
                      email:
                        type: string
                        example: admin@hackhub.com
                      role:
                        type: string
                        example: admin
        "401":
          description: Authentication required or access token is invalid/expired
        "403":
          description: Access forbidden because the user does not have the admin role

  /auth/verify-email:
    get:
      tags:
        - Authentication
      summary: Verify user email
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified successfully. Registration completed. User can now log in.
        "400":
          description: Invalid or expired verification token
        "500":
          description: Server error

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email request processed
        "400":
          description: Invalid email or email already verified
        "429":
          description: Too many verification email requests
        "500":
          description: Server error

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Password reset request processed
        "400":
          description: Invalid email
        "500":
          description: Server error

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset user password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid or expired password reset token
        "500":
          description: Server error

  /teams:
    get:
      tags:
        - Teams
      summary: List teams linked to a hackathon
      parameters:
        - name: hackathonId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, closed]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated team list
        "400":
          description: hackathonId missing or invalid
    post:
      tags:
        - Teams
      summary: Create a team for a hackathon
      description: Requires authentication. The caller becomes the team leader.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
        "400":
          description: Invalid input
        "401":
          description: Authentication required

  /teams/{id}:
    get:
      tags:
        - Teams
      summary: Get one team by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team details
        "400":
          description: Invalid team id
        "404":
          description: Team not found
    patch:
      tags:
        - Teams
      summary: Update a team
      description: Only the team leader can update. Members, leader and hackathon cannot be changed here.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Team updated
        "400":
          description: Invalid input
        "401":
          description: Authentication required
        "403":
          description: Only the team leader can do this
        "404":
          description: Team not found
    delete:
      tags:
        - Teams
      summary: Delete a team
      description: Only the team leader can delete.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Team deleted
        "401":
          description: Authentication required
        "403":
          description: Only the team leader can do this
        "404":
          description: Team not found

  /users/discover:
    get:
      tags:
        - Teams
      summary: Discover teammates by skills and availability
      description: Login required. Only users who opted in (looking for a team and discoverable) are listed, best skill match first. Contact details are never exposed.
      security:
        - bearerAuth: []
      parameters:
        - name: skills
          in: query
          required: false
          schema:
            type: string
          example: react,node
        - name: availability
          in: query
          required: false
          schema:
            type: string
            enum: [available, limited, unavailable]
        - name: lookingForTeam
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Ranked teammate list
        "400":
          description: Invalid filter value
        "401":
          description: Authentication required

  /hackathons:
    get:
      tags:
        - Hackathons
      summary: Search, filter, and paginate the public catalogue
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: skills
          in: query
          description: Comma-separated skill values.
          schema: { type: string }
        - name: domain
          in: query
          description: Comma-separated domains.
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: string, enum: [online, offline, hybrid] }
        - name: location
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [upcoming, ongoing, completed, inactive] }
        - name: minPrize
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrize
          in: query
          schema: { type: number, minimum: 0 }
        - name: fromDate
          in: query
          schema: { type: string, format: date-time }
        - name: toDate
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [title, deadline, prize_high, prize_low, newest] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Catalogue page and filtered facet counts.
        "400":
          description: Invalid filter.

  /hackathons/facets:
    get:
      tags: [Hackathons]
      summary: Get active catalogue facet counts.
      responses:
        "200":
          description: Counts for domains, skills, modes, and sources.

  /hackathons/recommendations:
    get:
      tags: [Hackathons]
      summary: Get personalized hackathon recommendations.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        "200":
          description: Ranked recommendations with heuristic score breakdowns.
        "401": { description: Authentication required. }

  /hackathons/{id}:
    get:
      tags: [Hackathons]
      summary: Get a visible hackathon by MongoDB ID or slug.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Hackathon details. }
        "404": { description: Hackathon not found. }

  /calendar:
    get:
      tags: [Calendar]
      summary: Get visible catalogue deadlines for a month.
      description: Requires authentication; results include visible hackathon registration, submission, and event dates.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200": { description: Events within the requested calendar month. }
        "400": { description: Invalid month. }
        "401": { description: Authentication required. }

  /reminders:
    get:
      tags: [Reminders]
      security:
        - bearerAuth: []
      summary: List the current user's reminders.
      responses:
        "200": { description: Reminder list. }
        "401": { description: Authentication required. }
    post:
      tags: [Reminders]
      security:
        - bearerAuth: []
      summary: Create a reminder for a hackathon event date.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hackathonId, daysBefore]
              properties:
                hackathonId: { type: string }
                eventType: { type: string, enum: [registration, submission, event], default: registration }
                daysBefore: { type: integer, minimum: 0, maximum: 365 }
                channel: { type: string, enum: [email, in_app], default: email }
      responses:
        "201": { description: Reminder created. }
        "400": { description: Invalid reminder input. }
        "409": { description: Duplicate reminder. }
        "401": { description: Authentication required. }

  /reminders/{id}:
    delete:
      tags: [Reminders]
      security:
        - bearerAuth: []
      summary: Delete one of the current user's reminders.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Reminder deleted. }
        "404": { description: Reminder not found. }

  /reminders/preferences:
    get:
      tags: [Reminders]
      security:
        - bearerAuth: []
      summary: Get reminder preferences.
      responses:
        "200": { description: Current user's reminder preferences. }
    put:
      tags: [Reminders]
      security:
        - bearerAuth: []
      summary: Update reminder preferences.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header. Any preference field may be updated; quiet hours use IST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultDaysBefore: { type: integer, minimum: 0, maximum: 365 }
                channels:
                  type: array
                  items: { type: string, enum: [email, in_app] }
                quietHours:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
                    end: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
      responses:
        "200": { description: Preferences saved. }
        "400": { description: Invalid preferences. }

  /stats:
    get:
      tags: [Operations]
      summary: Get public platform counters.
      responses:
        "200":
          description: Counts of hackathons, teams, builders, open teams, and matches.

  /feedback:
    post:
      tags: [Operations]
      summary: Submit anonymous feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, message]
              properties:
                type: { type: string, enum: [general, bug, feature, content] }
                message: { type: string, minLength: 5, maxLength: 2000 }
                page: { type: string }
                email: { type: string, format: email }
      responses:
        "201": { description: Feedback accepted. }
        "400": { description: Invalid feedback. }

  /saved:
    get:
      tags: [Saved hackathons]
      security:
        - bearerAuth: []
      summary: List the current user's saved hackathons.
      responses:
        "200": { description: Saved hackathon tracking records. }
    post:
      tags: [Saved hackathons]
      security:
        - bearerAuth: []
      summary: Save a hackathon by ID or slug.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hackathonId]
              properties:
                hackathonId: { type: string }
      responses:
        "201": { description: Saved hackathon. }
        "404": { description: Hackathon not found. }

  /saved/{id}:
    patch:
      tags: [Saved hackathons]
      security:
        - bearerAuth: []
      summary: Update tracking status or notes.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [saved, registered, ongoing, completed] }
                notes: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Tracking record updated. }
        "404": { description: Saved hackathon not found. }
    delete:
      tags: [Saved hackathons]
      security:
        - bearerAuth: []
      summary: Remove a saved hackathon from the dashboard.
      description: Requires the double-submit CSRF cookie and X-CSRF-Token header.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Saved hackathon removed. }
        "404": { description: Saved hackathon not found. }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Berwin
        email:
          type: string
          format: email
          example: berwin@test.com
        password:
          type: string
          format: password
          example: Test@123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: berwin@test.com
        password:
          type: string
          format: password
          example: Test@123

    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: berwin@test.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          example: verification-token-here
        password:
          type: string
          format: password
          example: NewPassword123

    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        hackathon:
          type: string
        leader:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              user:
                type: string
              role:
                type: string
              joinedAt:
                type: string
                format: date-time
        rolesNeeded:
          type: array
          items:
            type: string
        maxTeamSize:
          type: integer
        size:
          type: integer
        openSlots:
          type: integer
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTeamRequest:
      type: object
      required:
        - name
        - hackathonId
      properties:
        name:
          type: string
          example: Pixel Builders
        hackathonId:
          type: string
        description:
          type: string
        rolesNeeded:
          type: array
          items:
            type: string
          example: [designer, backend]
        maxTeamSize:
          type: integer
          default: 4

    UpdateTeamRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        rolesNeeded:
          type: array
          items:
            type: string
        maxTeamSize:
          type: integer
        status:
          type: string
          enum: [open, closed]

    TeammateCard:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        skills:
          type: array
          items:
            type: string
        availability:
          type: string
          enum: [available, limited, unavailable]
        lookingForTeam:
          type: boolean
        matchCount:
          type: integer